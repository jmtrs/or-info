# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      apiKey:
        type: string
        description: OpenRouter API key (optional, for higher rate limits)
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@aggc/or-info', '--mcp'],
      env: config.apiKey ? { OPENROUTER_API_KEY: config.apiKey } : {}
    })
